# Standalone QA only: no .env, no production volume, no exposed database port.
# PostgreSQL data is temporary and disappears when this QA container is removed.
services:
  qa-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lexiread_qa
      POSTGRES_USER: lexiread_qa
      POSTGRES_PASSWORD: lexiread-qa-local-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiread_qa -d lexiread_qa"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    image: lexiread-qa-web:local
    entrypoint: ["python"]
    command: ["manage.py", "runserver", "0.0.0.0:8000", "--settings=config.qa_settings", "--noreload", "--insecure"]
    environment:
      DJANGO_SETTINGS_MODULE: config.qa_settings
      LEXIREAD_QA_DB_HOST: qa-db
    ports:
      - "127.0.0.1:8766:8000"
    volumes:
      - ./lexiread_data_v1:/app/lexiread_data_v1:ro
    depends_on:
      qa-db:
        condition: service_healthy
