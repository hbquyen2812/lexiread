<section class="community-summary" aria-label="Hoạt động học tập">
  <header><h2>{% if community.is_demo %}Hoạt động bản thử nghiệm{% else %}Cùng nhau học mỗi ngày{% endif %}</h2><span>30 ngày gần đây</span></header>
  <dl class="community-metrics">
    <div><dt>Tài khoản đã học</dt><dd>{{ community.active_learners }}</dd></div>
    <div><dt>Bài luyện đã làm</dt><dd>{{ community.practice_attempts }}</dd></div>
    <div><dt>Lượt ôn từ</dt><dd>{{ community.word_reviews }}</dd></div>
  </dl>
</section>
