services:
  web:
    environment:
      DOMAIN: "${DOMAIN:?Thiếu DOMAIN trong .env}"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "${DOMAIN:?Thiếu DOMAIN trong .env}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://${DOMAIN:?Thiếu DOMAIN trong .env}"
      PUBLIC_SITE_URL: "https://${DOMAIN:?Thiếu DOMAIN trong .env}"
      DJANGO_HTTPS: "true"
      TRUST_PROXY_HTTPS: "true"
      DJANGO_HSTS_SECONDS: "${DJANGO_HSTS_SECONDS:-3600}"
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: "${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-false}"
      DJANGO_HSTS_PRELOAD: "${DJANGO_HSTS_PRELOAD:-false}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':os.environ['DOMAIN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request,timeout=5)"]
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: "${DOMAIN:?Thiếu DOMAIN trong .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
