name: Production static assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collectstatic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Build and serve production static assets
        run: python manage.py test learning.test_static_build --settings=config.test_settings --verbosity 2
